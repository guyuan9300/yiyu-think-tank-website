    # BEGIN yiyu-library-handbook-hidden
    # 独立隐藏工作页：不进入官网导航，不参与主 SPA 构建。
    location ^~ /library-handbook/ {
        root /var/www/yiyu-site;
        index index.html;
        try_files $uri $uri/ /library-handbook/index.html;
        sub_filter "__yiyu_library_handbook_no_inject__" "";
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header Cache-Control "no-cache";
    }

    location ^~ /api/library-handbook/ {
        proxy_pass http://127.0.0.1:8792/api/library-handbook/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        client_max_body_size 64m;
        add_header Cache-Control "no-store" always;
    }

    location = /healthz-library-handbook {
        proxy_pass http://127.0.0.1:8792/healthz;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "no-store" always;
    }
    # END yiyu-library-handbook-hidden

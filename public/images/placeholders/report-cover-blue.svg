  <g transform="translate(210 340)" opacity="0.9">
    <rect x="0" y="0" width="110" height="140" rx="14" fill="#e2e8f0" stroke="#94a3b8"/>
    <line x1="22" y1="36" x2="88" y2="36" stroke="#64748b" stroke-width="8" stroke-linecap="round"/>
    <line x1="22" y1="62" x2="88" y2="62" stroke="#64748b" stroke-width="8" stroke-linecap="round"/>
    <line x1="22" y1="88" x2="70" y2="88" stroke="#64748b" stroke-width="8" stroke-linecap="round"/>
  </g>
</svg>

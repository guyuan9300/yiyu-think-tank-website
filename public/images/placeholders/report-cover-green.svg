<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16a34a"/>
      <stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.22"/>
    </filter>
  </defs>
  <rect width="1200" height="675" fill="url(#g)"/>
  <g filter="url(#shadow)" opacity="0.92">
    <rect x="140" y="120" width="920" height="435" rx="28" fill="#ffffff"/>
  </g>
  <g fill="#052e16" opacity="0.92">
    <text x="210" y="220" font-size="44" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial">报告封面（占位）</text>
    <text x="210" y="290" font-size="26" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial" opacity="0.75">如需更好效果，可在后台手动上传封面图</text>
  </g>
  <g transform="translate(210 340)" opacity="0.9">
    <rect x="0" y="0" width="110" height="140" rx="14" fill="#dcfce7" stroke="#86efac"/>
    <line x1="22" y1="36" x2="88" y2="36" stroke="#166534" stroke-width="8" stroke-linecap="round"/>
    <line x1="22" y1="62" x2="88" y2="62" stroke="#166534" stroke-width="8" stroke-linecap="round"/>
    <line x1="22" y1="88" x2="70" y2="88" stroke="#166534" stroke-width="8" stroke-linecap="round"/>
  </g>
</svg>

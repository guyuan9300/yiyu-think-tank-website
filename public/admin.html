<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>益语智库管理后台跳转中</title>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var legacyTab = params.get('legacyTab');
      var tabMap = {
        insights: 'insights',
        reports: 'reports',
        books: 'books',
        methodologies: 'methodologies',
        'user-management': 'user-management',
        comments: 'comments',
        settings: 'settings'
      };
      var tab = tabMap[legacyTab || ''] || params.get('tab') || 'dashboard';
      var next = new URL(window.location.origin + window.location.pathname.replace(/admin\.html$/, ''));
      next.searchParams.set('page', 'admin');
      if (tab !== 'dashboard') {
        next.searchParams.set('tab', tab);
      }
      window.location.replace(next.toString());
    })();
  </script>
</head>
<body>
  <p>后台入口已迁移，正在跳转到正式后台...</p>
</body>
</html>
